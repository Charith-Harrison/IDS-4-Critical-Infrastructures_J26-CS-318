<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modbus/TCP Replay Attack Detection Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="title-group">
                <h1>Protocol-Aware Replay Attack Detection</h1>
                <p class="subtitle">Transaction consistency and gradient-boosted detection for Modbus/TCP industrial networks</p>
            </div>

        </div>
        <nav class="nav-tabs">
            <div class="nav-container">
                <a href="{{ url_for('main.upload_page') }}" class="nav-tab {{ 'active' if active_tab == 'upload' else '' }}">
                    File Upload
                </a>
                <a href="{{ url_for('main.audit_page') }}" class="nav-tab {{ 'active' if active_tab == 'audit' else '' }}">
                    <span class="tab-index">A</span> Data Audit
                </a>
                <a href="{{ url_for('main.features_page') }}" class="nav-tab {{ 'active' if active_tab == 'features' else '' }}">
                    <span class="tab-index">B</span> Features & Split
                </a>
                <a href="{{ url_for('main.training_page') }}" class="nav-tab {{ 'active' if active_tab == 'training' else '' }}">
                    <span class="tab-index">C</span> Train Model
                </a>
                <a href="{{ url_for('main.evaluation_page') }}" class="nav-tab {{ 'active' if active_tab == 'evaluation' else '' }}">
                    <span class="tab-index">D</span> Preliminary Evaluation
                </a>
            </div>
        </nav>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
