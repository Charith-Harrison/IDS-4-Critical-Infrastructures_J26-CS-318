name: c3-qualification-v02
services:
  qualification:
    build:
      context: .
      network: none
    image: c3-qualification:0.2.0
    network_mode: none
    cap_drop: [ALL]
    cap_add: [NET_RAW, SETGID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=32m
    volumes:
      - ../component3_collection_runs/design-v1:/output
    environment:
      C3QUAL_ISOLATED_DOCKER: "1"
    mem_limit: 256m
    cpus: 1.0
    init: true
    pids_limit: 64
